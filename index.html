<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAME Web Test</title>
    <style>
        body { background-color: #222; color: white; font-family: Arial, sans-serif; padding: 20px; }
        textarea { width: 100%; height: 200px; background: #333; color: white; border: 1px solid #555; padding: 10px; font-family: monospace; }
        button { background: #ff4500; color: white; border: none; padding: 10px 20px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        pre { background: #111; padding: 15px; border: 1px solid #333; white-space: pre-wrap; color: #00ff00; }
        .error { color: #ff0000; }
    </style>
</head>
<body>
    <h2>Motor de FLAME en el Navegador</h2>
    <textarea id="codigo">
!stil flamecode
<flamecode>
@nombre = "Creador":
manifest! = "Hola " H @nombre:
</flamecode>
    </textarea>
    <br>
    <button id="btn-ejecutar">Ejecutar FLAME</button>
    <h3>Salida:</h3>
    <pre id="salida">Esperando instrucciones...</pre>

    <script type="module">
        const outputDiv = document.getElementById('salida');
        const btn = document.getElementById('btn-ejecutar');

        // Atrapamos cualquier error global
        window.onerror = function(message, source, lineno, colno, error) {
            outputDiv.textContent = "Error del sistema: " + message;
            outputDiv.classList.add('error');
        };

        async function cargarMotor() {
            try {
                outputDiv.textContent = "Cargando modulo .wasm...";
                const modulo = await import('./pkg/flame_motor.js');
                await modulo.default();
                
                outputDiv.textContent = "Motor cargado exitosamente. Listo para ejecutar.";
                
                btn.onclick = () => {
                    try {
                        const codigo = document.getElementById('codigo').value;
                        const resultado = modulo.ejecutar_flame_web(codigo);
                        outputDiv.textContent = resultado;
                        outputDiv.classList.remove('error');
                    } catch (err) {
                        outputDiv.textContent = "Error al ejecutar: " + err.message;
                        outputDiv.classList.add('error');
                    }
                };
            } catch (error) {
                outputDiv.textContent = "Error cargando WebAssembly: " + error.message + "\nAsegurate de que la carpeta pkg existe y el servidor esta corriendo.";
                outputDiv.classList.add('error');
            }
        }
        cargarMotor();
    </script>
</body>
</html>
